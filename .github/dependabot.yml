# The pinned npm packages that the proxy contract compiles against, and the workflow actions.
# Elixir dependencies are updated by the Update Packages workflow. Neither ships in the Hex
# package, so every update is no-release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /ContractTests/TypeScript
    schedule:
      interval: weekly
    labels:
      - dependencies
      - no-release
  - package-ecosystem: npm
    directory: /Samples/frontend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - no-release
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - no-release
