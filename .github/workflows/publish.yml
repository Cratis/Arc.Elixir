name: Publish Arc for Elixir

# Never cancel a release in flight. On push every merge to main shares one group, so cancelling would let the
# next merge kill a run that may already have tagged and cut the release but not yet finished publishing.
# Keep up to 100 pending Publish runs in FIFO order with `queue: max` (Cratis/Workflows#162).
# The default single pending slot drops the older pending release when a third merge arrives.
# Omit `cancel-in-progress`: GitHub rejects it together with `queue: max`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

env:
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.5"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  issues: write
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  # Releasing on push rather than on the pull_request closed event is deliberate. A pull request from a fork
  # runs with a read-only GITHUB_TOKEN and no secrets even on merge, so it cannot create the release or reach
  # the publishing credentials. A push to main always runs with a full-permission token, and the release
  # action finds the merged pull request and its label from the commit.
  push:
    branches:
      - main
    paths:
      - "Source/**"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      reason: ${{ steps.release.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache Mix dependencies
        uses: actions/cache@v6
        with:
          path: |
            Source/arc/deps
            Source/arc/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('Source/arc/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install Hex and Rebar
        working-directory: ./Source/arc
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        working-directory: ./Source/arc
        run: mix deps.get

      - name: Compile
        working-directory: ./Source/arc
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors

      - name: Run tests
        working-directory: ./Source/arc
        run: mix test

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, test]
    if: needs.release.outputs.publish == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache Mix dependencies
        uses: actions/cache@v6
        with:
          path: |
            Source/arc/deps
            Source/arc/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('Source/arc/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install Hex and Rebar
        working-directory: ./Source/arc
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        working-directory: ./Source/arc
        run: mix deps.get

      - name: Copy README and LICENSE for the Hex package
        run: |
          cp README.md Source/arc/README.md
          cp LICENSE Source/arc/LICENSE

      - name: Write package VERSION file
        run: echo "${{ needs.release.outputs.version }}" > Source/arc/VERSION

      - name: Compile
        working-directory: ./Source/arc
        run: mix compile

      - name: Publish to Hex
        working-directory: ./Source/arc
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  verify-published:
    # A merge that publishes nothing is the failure mode that silently costs a release: the release job
    # succeeds, every publish job is skipped for want of should-publish, and the whole run reports green. Fail
    # instead, so a release that did not happen cannot be mistaken for one that did.
    #
    # Only for the reasons that mean something went wrong. Publishing nothing is correct and routine for the
    # others - a commit pushed straight to main, a Dependabot merge, a re-run of a run that already released.
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Report that nothing was published
        run: |
          echo "::error::Nothing was published and no release was cut (reason: ${{ needs.release.outputs.reason }}). For 'no-label', add exactly one of major, minor or patch to the merged pull request and re-run this workflow - see the Verify Pull Request Policy check, which is meant to catch this before the merge."
          exit 1
