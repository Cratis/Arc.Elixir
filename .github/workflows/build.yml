# Compiles and tests on the pull request itself.
#
# Verification that only runs after a merge cannot inform the merge, so the same steps Publish
# runs run here first. The contract job additionally proves the generated TypeScript proxies:
# deterministic output, strict compilation against the published @cratis/arc packages, and the
# real Arc client running against an Arc for Elixir server.
name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

env:
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.5"

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache Mix dependencies
        uses: actions/cache@v6
        with:
          path: |
            Source/arc/deps
            Source/arc/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('Source/arc/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install Hex and Rebar
        working-directory: ./Source/arc
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        working-directory: ./Source/arc
        run: mix deps.get

      - name: Check formatting
        working-directory: ./Source/arc
        run: mix format --check-formatted

      - name: Compile
        working-directory: ./Source/arc
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors

      - name: Run tests
        working-directory: ./Source/arc
        run: mix test

  mongodb:
    name: MongoDB package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Change streams need a replica set, which a service container cannot start.
      - name: Start a MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'rs.status().members[0].stateStr' | grep -q PRIMARY && break
            sleep 1
          done

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        working-directory: ./Source/arc_mongodb
        run: mix deps.get

      - name: Check formatting
        working-directory: ./Source/arc_mongodb
        run: mix format --check-formatted

      - name: Compile
        working-directory: ./Source/arc_mongodb
        env:
          MIX_ENV: test
        run: mix compile --warnings-as-errors

      - name: Run tests
        working-directory: ./Source/arc_mongodb
        env:
          MONGODB_URL: mongodb://localhost:27017/?directConnection=true
        run: mix test

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify documentation excerpts against their sources
        run: python3 Documentation/verify-snippets.py

  samples:
    name: Samples
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Test the samples
        run: Samples/run-tests.sh

  proxy-contract:
    name: Proxy contract
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ContractTests/TypeScript/package-lock.json

      - name: Cache Mix dependencies
        uses: actions/cache@v6
        with:
          path: |
            Source/arc/deps
            Source/arc/_build
          key: ${{ runner.os }}-mix-contract-${{ hashFiles('Source/arc/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-contract-

      - name: Install Hex and Rebar
        working-directory: ./Source/arc
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Run the proxy contract
        run: ContractTests/run.sh
